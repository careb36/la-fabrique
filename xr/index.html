<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Fabrique XR</title>
    <!-- No icon to fetch: the browser would otherwise ask for one and log a 404. -->
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
      #scene-container { position: fixed; inset: 0; }
      #notice {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; color: #a1a1aa; font: 16px/1.5 system-ui, sans-serif;
        pointer-events: none;
      }
      #notice strong { color: #f4f4f5; }
      #notice.error { color: #fca5a5; pointer-events: auto; }
      #notice p { max-width: 34rem; margin: 0; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <!-- Shown until the room draws its first frame, so the page is never a
         silent black screen; main.ts replaces it with the reason on failure. -->
    <div id="notice"><p><strong>La Fabrique XR</strong><br />Loading the control room...</p></div>
    <script>
      // A browser that cannot run the app at all never reaches main.ts.
      setTimeout(function () {
        var n = document.getElementById('notice');
        if (n && !n.classList.contains('error') && n.style.display !== 'none') {
          n.className = 'error';
          n.innerHTML = '<p><strong>The room did not start.</strong><br />Try a recent Chrome or Edge with hardware acceleration on, or the Meta Quest browser.</p>';
        }
      }, 20000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
