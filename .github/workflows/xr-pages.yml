name: La Fabrique XR to GitHub Pages

# Tests and builds xr/ and publishes it as the repository's GitHub Pages site:
# the link the Meta VR Start Developer Competition judges open. The entry
# lives on the meta-vr branch (main is the web product only); it runs on a
# push to meta-vr that touches xr/, and on demand.
#
# Two settings, once, by the repository owner:
#   Settings → Pages → Source: "GitHub Actions".
#   Settings → Environments → github-pages → Deployment branches and tags:
#   add meta-vr (only the default branch is allowed out of the box).

on:
  push:
    branches: [meta-vr]
    paths:
      - "xr/**"
      - ".github/workflows/xr-pages.yml"
  pull_request:
    paths:
      - "xr/**"
      - ".github/workflows/xr-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xr-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xr/package-lock.json
      - run: npm ci
      - run: npm run test:run
      # A project site lives under /<repository name>/.
      - run: npm run build
        env:
          XR_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: xr/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
