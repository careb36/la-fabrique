# File sizes — a source file over the line limit may not grow
# (scripts/check_file_sizes.py, baseline in scripts/file_size_baseline.json).
#
# Run the same check locally with:
#   python3 scripts/check_file_sizes.py

name: File Sizes

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'vscode-daemon/**'
      - 'llm-proxy/**'
      - 'scripts/**'
      - '.github/workflows/file-sizes.yml'

permissions:
  contents: read


# A new push cancels the runs of the commit it replaces instead of queueing
# behind them.
concurrency:
  group: file-sizes-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: No file over the limit grows
        run: python3 scripts/check_file_sizes.py
