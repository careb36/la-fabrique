# SLSA Level 3 Provenance — Le Fabrique
# Generates cryptographic provenance for Docker images on each release.
# Verify with: https://github.com/slsa-framework/slsa-verifier
# Spec: https://slsa.dev/spec/v0.1/requirements

name: SLSA Provenance — Le Fabrique

on:
  workflow_dispatch:
  release:
    types: [created]


# Al llegar un push nuevo se cancelan las ejecuciones del commit que reemplaza
# en vez de encolarse.
concurrency:
  group: slsa3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    name: Build & hash Docker images
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        run: |
          docker build -t le-fabrique-backend:${{ github.ref_name }}   ./backend
          docker build -t le-fabrique-frontend:${{ github.ref_name }}  ./frontend
          docker build -t le-fabrique-llm-proxy:${{ github.ref_name }} ./llm-proxy

      - name: Export images as tarballs
        run: |
          docker save le-fabrique-backend:${{ github.ref_name }}   -o le-fabrique-backend.tar
          docker save le-fabrique-frontend:${{ github.ref_name }}  -o le-fabrique-frontend.tar
          docker save le-fabrique-llm-proxy:${{ github.ref_name }} -o le-fabrique-llm-proxy.tar

      - name: Generate SHA256 subjects
        id: hash
        run: |
          set -euo pipefail
          echo "digests=$(sha256sum le-fabrique-*.tar | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: le-fabrique-images-${{ github.ref_name }}
          path: le-fabrique-*.tar
          retention-days: 5

  provenance:
    name: Generate SLSA provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
