# Assistant and demo — the desktop assistant (asistente-b1/), the coding-agent
# demo (demo/) and the hackathon requirements checker (tools/).
#
# Run the same checks locally with:
#   pip install pytest pytest-asyncio numpy
#   (cd asistente-b1 && python -m pytest tests -q)
#   python -m pytest tests -q
#   python tools/hackathon_check.py

name: Assistant and Demo

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'asistente-b1/**'
      - 'demo/**'
      - 'tools/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/assistant-tests.yml'

permissions:
  contents: read

# A new push cancels the runs of the commit it replaces instead of queueing
# behind them.
concurrency:
  group: assistant-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # The assistant's core is standard library only; numpy covers the audio
      # path its tests exercise. PyQt6, faster-whisper and Piper stay optional.
      - name: Install the test dependencies
        run: python -m pip install pytest pytest-asyncio numpy

      - name: Assistant tests
        working-directory: ./asistente-b1
        run: python -m pytest tests -q

      - name: Demo tests
        run: python -m pytest tests -q

      - name: Hackathon requirements (offline)
        run: python tools/hackathon_check.py
