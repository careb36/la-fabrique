[tool.poetry]
name = "le-fabrique-backend"
version = "2026.4.1"
description = "Autonomous AI Engineering Factory API"
authors = ["La Fabrique Engineering Team"]
package-mode = false
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.162.0"
uvicorn = {version = "^0.54.0", extras = ["standard"]}
pydantic = "^2.13.5"
pydantic-settings = "^2.2.0"
psycopg2-binary = "^2.9.9"
neo4j = ">=5.18,<7.0"
nats-py = "^2.16.0"
langgraph = "^1.1.6"
langchain = "^1.2.15"
langchain-core = "^1.3.3"
httpx = "^0.28.1"
requests = "^2.33.1"
cryptography = "^50.0.1"
sqlmodel = "^0.0.38"
sqlalchemy = "^2.0.55"
typing-extensions = "^4.15.0"
opentelemetry-api = "^1.45.1"
opentelemetry-sdk = "^1.45.1"
opentelemetry-exporter-otlp = "^1.45.1"
opentelemetry-exporter-otlp-proto-http = "^1.45.1"
opentelemetry-instrumentation-fastapi = "^0.66b1"
opentelemetry-instrumentation-requests = "^0.66b1"
opentelemetry-instrumentation-httpx = "^0.66b1"
langchain-openai = "^1.1.12"
pyjwt = ">=2.8,<3"
# Hash de contrasenas directo, sin passlib: el sondeo de passlib al importar
# rompia con bcrypt 5, y por eso hubo un tope en 4. Ver app/passwords.py.
bcrypt = "<6"
slowapi = "^0.1.10"
prometheus-client = "^0.26.0"
starlette = "^1.3.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.1,<10.0.0"
pytest-asyncio = ">=0.23.6,<1.5.0"
black = ">=24.3,<27.0"
isort = "^9.0.2"
mypy = ">=1.9,<3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
