version: 2

# Weekly, grouped dependency updates. Security updates are opened as soon as
# GitHub publishes them; grouped version updates keep the PR queue small.
updates:
  # Python — backend and llm-proxy use Poetry; vscode-daemon uses requirements.txt.
  - package-ecosystem: pip
    directory: /backend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # sqlmodel 0.0.48 requires timezone-aware datetimes; the code fills the
    # columns with datetime.utcnow(). All three numbers are at 0.0.x, so to
    # Dependabot every jump is minor or patch: they all have to be ignored
    # until the data model migration exists.
    ignore:
      - dependency-name: "sqlmodel"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /llm-proxy
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      llm-proxy-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /vscode-daemon
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:25"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      vscode-daemon-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Node — frontend/package.json + package-lock.json.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # @vitejs/plugin-react 6 requires vite ^8 and the project is on vite ^5;
    # react 19 leaves react-dom mismatched and breaks tsc and the 49 test
    # files. Both need a migration of their own, not an automatic bump.
    ignore:
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        # Without this, a minor react-dom bump lands here and a major react
        # bump lands in the `react` group: they arrive in separate PRs and the
        # pair goes out of step, which is exactly what broke `npm ci` in #252.
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

      # React and React DOM always move together: bumping react-dom alone
      # leaves react on the previous major and `npm ci` dies with ERESOLVE.
      # The @types packages must follow their runtime counterpart for the
      # same reason.
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Docker — one directory per Dockerfile.
  - package-ecosystem: docker
    directory: /backend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:35"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /backend/janitor
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:36"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /frontend
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /llm-proxy
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /vscode-daemon
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:50"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Docker Compose — the root only has docker-compose.yml, no Dockerfile,
  # so the "docker" ecosystem would not detect that file.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "03:55"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions — the workflows in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
