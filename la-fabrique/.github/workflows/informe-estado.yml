# The «Informe de estado» (status report) button: opens an issue in this
# repository with the `informe` label. The factory's documentation automation
# reacts to that label and posts the executive report as a comment on that
# same issue.
#
# The report is NOT committed: this repository is public and the report details
# the operational state of the five systems, private ones included (which CI
# fails, how many dependency alerts are open and how many are critical). The
# issue is just as accessible to management and no search engine indexes it.

name: Informe de estado

on:
  workflow_dispatch:
    inputs:
      foco:
        description: "Optional focus of the report (e.g. 'USB stick delivery', 'security')"
        required: false
        type: string
      periodo:
        description: "Window to compare (by default, since the previous report)"
        required: false
        type: string

concurrency:
  group: informe-estado
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  solicitar:
    name: Request report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create the issue and label it
        env:
          GH_TOKEN: ${{ github.token }}
          FOCO: ${{ inputs.foco }}
          PERIODO: ${{ inputs.periodo }}
          SOLICITANTE: ${{ github.actor }}
        run: |
          set -euo pipefail
          fecha="$(date -u +%Y-%m-%d)"
          foco="${FOCO:-estado general de los cinco sistemas}"
          periodo="${PERIODO:-desde el informe anterior; si no existe, últimos 30 días}"
          body="$(printf 'Informe ejecutivo de estado de los cinco sistemas.\n\n**Foco:** %s\n**Ventana:** %s\n\nSolicitado por @%s desde el botón «Informe de estado».\n' "$foco" "$periodo" "$SOLICITANTE")"

          url="$(gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Informe de estado — $fecha" \
            --body "$body")"
          number="${url##*/}"

          # The label is added in a second step on purpose: that way GitHub
          # emits the `issues.labeled` event that triggers the automation.
          gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --add-label informe

          echo "Issue #$number etiquetado; la fábrica generará el informe."
