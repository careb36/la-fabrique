name: Docker Build

# Building each image from scratch catches what no unit test sees: a `COPY`
# that left out a module (the proxy started straight into
# `ModuleNotFoundError: No module named 'upstream'`), a dependency that only
# exists in the development venv, a `setuptools` that installed fine and breaks
# on import. The tests run on the working tree; this runs on what is actually
# deployed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'llm-proxy/**'
      - 'vscode-daemon/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # One broken image must not hide the state of the other four.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: janitor
            # The Dockerfile copies `backend/janitor/main.py`, so the
            # context is the root (same as in docker-compose.yml).
            context: .
            dockerfile: ./backend/janitor/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: llm-proxy
            context: ./llm-proxy
            dockerfile: ./llm-proxy/Dockerfile
          - name: vscode-daemon
            context: ./vscode-daemon
            dockerfile: ./vscode-daemon/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build ${{ matrix.name }}
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "fabrique-${{ matrix.name }}:ci" \
            "${{ matrix.context }}"

      # Building does not prove the process starts: the proxy built fine and
      # died on the first import. These steps run the image.
      - name: Smoke test llm-proxy (serves /health)
        if: matrix.name == 'llm-proxy'
        env:
          # The runner is shared and two runs from different refs are not
          # serialized by the `concurrency` block: a fixed name and port would
          # clash between them.
          CONTAINER: fabrique-llm-proxy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker run -d --name "$CONTAINER" \
            --publish 127.0.0.1::5100 "fabrique-${{ matrix.name }}:ci"
          PORT=$(docker port "$CONTAINER" 5100 | head -1 | sed 's/.*://')
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/health" > /dev/null 2>&1; then
              echo "llm-proxy responds on /health (port $PORT)"
              exit 0
            fi
            sleep 1
          done
          echo "llm-proxy did not answer on /health; container logs:"
          docker logs "$CONTAINER"
          exit 1

      # The backend needs Postgres to start, so this only checks what the
      # incomplete `COPY` broke: that every import resolves.
      - name: Smoke test backend (imports resolve)
        if: matrix.name == 'backend'
        run: |
          docker run --rm --entrypoint python "fabrique-${{ matrix.name }}:ci" \
            -c "import app.main; print('imports OK')"

      # This Dockerfile copied a single file, so a new module next to
      # daemon.py was left out of the image. Importing it catches that.
      - name: Smoke test vscode-daemon (imports resolve)
        if: matrix.name == 'vscode-daemon'
        run: |
          docker run --rm --entrypoint python "fabrique-${{ matrix.name }}:ci" \
            -c "import daemon; print('daemon imports OK')"

      - name: Clean up ${{ matrix.name }}
        if: always()
        env:
          CONTAINER: fabrique-llm-proxy-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker rmi -f "fabrique-${{ matrix.name }}:ci" 2>/dev/null || true
