# SLSA Level 3 Provenance — Le Fabrique
# Generates cryptographic provenance for Docker images on each release.
# Verify with: https://github.com/slsa-framework/slsa-verifier
# Spec: https://slsa.dev/spec/v0.1/requirements

name: SLSA Provenance — Le Fabrique

on:
  workflow_dispatch:
  release:
    types: [created]


# When a new push arrives, the runs for the commit it replaces are cancelled
# instead of queueing.
concurrency:
  group: slsa3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    name: Build & hash Docker images
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # The tag name reaches the shell as an environment variable, never as
      # text pasted into the script, so a crafted tag cannot run commands.
      - name: Build Docker images
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker build -t "le-fabrique-backend:${TAG}"   ./backend
          docker build -t "le-fabrique-frontend:${TAG}"  ./frontend
          docker build -t "le-fabrique-llm-proxy:${TAG}" ./llm-proxy

      - name: Export images as tarballs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          docker save "le-fabrique-backend:${TAG}"   -o le-fabrique-backend.tar
          docker save "le-fabrique-frontend:${TAG}"  -o le-fabrique-frontend.tar
          docker save "le-fabrique-llm-proxy:${TAG}" -o le-fabrique-llm-proxy.tar

      - name: Generate SHA256 subjects
        id: hash
        run: |
          set -euo pipefail
          echo "digests=$(sha256sum le-fabrique-*.tar | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: le-fabrique-images-${{ github.ref_name }}
          path: le-fabrique-*.tar
          retention-days: 5

  provenance:
    name: Generate SLSA provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # by tag on purpose: the generator verifies it was called by a release tag
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
