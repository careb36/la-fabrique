name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'llm-proxy/**'
      - '.github/workflows/backend-tests.yml'


# When a new push arrives, the runs for the commit it replaces are cancelled
# instead of queueing.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # upload-artifact needs to write to the run's artifact store; a bare
    # `contents: read` would make the keep-the-logs step fail.
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    # A network hang in `poetry install` left this job stalled for 40 minutes
    # without anyone noticing (the default is 6 hours). The whole job takes ~5
    # minutes, so cutting it at 20 turns a hang into a visible failure.
    timeout-minutes: 20
    env:
      # At job level, not step level: if only `poetry install` has it, the
      # test step resolves another directory, does not find the venv just
      # created and makes an empty one ("Creating virtualenv ...n9PHBxPn" ->
      # "Command not found: pytest"). With the same path, both steps talk
      # about the same venv. `runner.temp` does not work here: the `runner`
      # context only exists in a step's `env`, and at job level it makes the
      # workflow invalid.
      POETRY_VIRTUALENVS_PATH: ${{ github.workspace }}/.poetry-backend
      # Poetry queries the keyring on every operation. On a runner without a
      # full desktop session, secretstorage opens DBus, gets no answer and
      # aborts `poetry install` ("Cannot install greenlet"). There is no
      # secret to look up here: the key is read from the environment.
      POETRY_NO_INTERACTION: "1"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12 (uv)
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages uv >/dev/null
          ~/.local/bin/uv python install 3.12
          ~/.local/bin/uv venv --python 3.12 --seed "$RUNNER_TEMP/venv-3.12"
          echo "$RUNNER_TEMP/venv-3.12/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          # Explicit `--python`: without it, uv looks for a `.venv` upwards and
          # may find one that does not belong to the job (with another Python),
          # install Poetry there, outside the PATH, and the next step dies with
          # `poetry: command not found`.
          ~/.local/bin/uv pip install --python "$RUNNER_TEMP/venv-3.12/bin/python" poetry >/dev/null
          poetry env use python
          poetry install --no-interaction

      - name: Lint with ruff
        working-directory: ./backend
        run: |
          pip install "ruff==0.17.1"
          ruff check app tests
          ruff format --check app tests

      - name: Type check with mypy
        working-directory: ./backend
        run: |
          pip install mypy
          # `app` has no __init__.py and imports itself both as `config` and
          # `app.config`, so mypy finds every file twice and aborts before it
          # checks anything. explicit-package-bases keeps it to one module name.
          mypy app --ignore-missing-imports --explicit-package-bases || true

      - name: Run tests
        working-directory: ./backend
        run: |
          PYTHONPATH=.:app poetry run pytest tests -v --tb=short

      - name: Run llm-proxy tests
        working-directory: .
        env:
          # The proxy has its own pyproject and needs a separate venv.
          POETRY_VIRTUALENVS_CREATE: "true"
          POETRY_VIRTUALENVS_PATH: ${{ runner.temp }}/poetry-llm
        run: |
          # `timeout` so that a PyPI registry that does not answer fails with
          # the command in view instead of hanging the whole job. The install
          # always runs: it is idempotent and comes from the cache in seconds,
          # and a guard like "does pip exist?" accepts an empty venv.
          # Everything through `poetry run`: `poetry env info --path` may
          # resolve to a different venv than the one `poetry install` just
          # filled.
          timeout 900 bash -c 'cd llm-proxy && poetry install --no-interaction --no-root'
          timeout 300 poetry run --directory llm-proxy pip install -r requirements-dev.txt
          poetry run --directory llm-proxy python -m pytest -q

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-coverage
          path: ./backend/htmlcov/
