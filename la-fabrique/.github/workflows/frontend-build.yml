# Frontend build — runs typecheck, tests, and build on every pull request that touches
# frontend code or this workflow, and on pushes to the main branch
# branches. Pushes to other branches do not trigger it; open a pull request for
# a run.
#
# Run the same checks locally with:
#   cd frontend && npm ci && npx tsc --noEmit && npm run lint && npm run test:run && npm run build

name: Frontend Build

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: typecheck, test, and build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (user-facing text goes through i18n)
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
